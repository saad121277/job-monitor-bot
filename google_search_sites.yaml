settings:
  enabled: true
  max_results_per_query: 10
  min_seconds_between_queries: 2.0
  max_consecutive_failures: 3
  query_negative_terms: []
  serper_time_filter: "qdr:w"
  serper_countries: []
  serper_max_retries_per_query: 2
  serper_stop_on_rate_limit: true

keywords:
  - '"LMIA" ("Canada" OR "barber" OR "hairstylist" OR "driver" OR "cook" OR "welder")'
  - '("visa sponsorship" OR "work permit" OR "relocation") ("Latvia" OR "Riga" OR "Spain" OR "Italy")'
  - '("contrat" OR "recrutement" OR "Decreto Flussi" OR "origen") ("Espagne" OR "Italie" OR "Espagna" OR "Italia" OR "Maroc")'

sites:
  - domain: "jobbank.gc.ca"
    name: "Canada Job Bank"

  - domain: "cv.lv"
    name: "Latvia CV.lv"

  - domain: "eures.europa.eu"
    name: "EURES (EU/Latvia/Spain/Italy)"

  - domain: "anapec.org"
    name: "ANAPEC Maroc"

  - domain: "dreamjob.ma"
    name: "Dreamjob Maroc"

  - domain: "infojobs.net"
    name: "Spain InfoJobs"

  - domain: "subito.it"
    name: "Italy Subito"
