settings:
  enabled: true
  max_results_per_query: 10
  min_seconds_between_queries: 2.0
  max_consecutive_failures: 3
  query_negative_terms: []
  serper_time_filter: "qdr:w"
  serper_countries: []
  serper_max_retries_per_query: 2
  serper_stop_on_rate_limit: true

keywords:
  - '("LMIA" OR "Temporary Foreign Worker" OR "foreign workers")'
  - '("visa sponsorship" OR "relocation" OR "recrutement international")'
  - '("barber" OR "hairstylist" OR "parrucchiere" OR "peluquero" OR "coiffeur")'

sites:
  - domain: "jobbank.gc.ca"
    name: "Canada Job Bank"

  - domain: "anapec.org"
    name: "ANAPEC International"

  - domain: "arbeitnow.com"
    name: "Arbeitnow Visa"

  - domain: "eures.europa.eu"
    name: "EURES Europe"

  - domain: "dreamjob.ma"
    name: "Dreamjob International"

  - domain: "es.indeed.com"
    name: "Indeed Spain"

  - domain: "it.indeed.com"
    name: "Indeed Italy"
